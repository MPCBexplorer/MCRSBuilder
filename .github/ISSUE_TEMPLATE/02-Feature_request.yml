name: "🚀 Feature Request"
description: "Submit a feature request to help improve the simulator 🙋"
title: "[🚀Feature]: "
labels: ["feature", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature! Please fill out the form below with as much detail as possible.

  - type: checkboxes
    id: confirmation
    attributes:
      label: ✅ Confirmation Checklist
      options:
        - label: I have searched the existing issues to ensure this feature has not been requested before
          required: true
        - label: I have considered whether this feature fits within the scope of the simulator
          required: true
        - label: I have considered the potential impact on existing features
          required: true
        - label: I have thought about how this feature would be implemented (Suggestions with solutions will be treated priorly)
          required: false
  - type: textarea
    id: description
    attributes:
      label: 📋 Description
      description: Please provide a clear and concise description of the feature you'd like to see
      placeholder: Describe the feature in detail, including what it does and how it would benefit users
    validations:
      required: true

  - type: textarea
    id: use_cases
    attributes:
      label: 🎯 Use Cases
      description: Please describe the use cases for this feature
      placeholder: Explain how users would benefit from this feature and in what scenarios it would be useful
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 🔗 Related Problem (Optional)
      description: Is your feature request related to a problem? Please describe
      placeholder: A clear and concise description of what the problem is. Ex. I have an issue when [...]
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 🛠️ Solution (Optional)
      description: Please describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen. Add any considered drawbacks.Include any technical details, code snippets, or design considerations
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives (Optional)
      description: Please describe any alternative solutions or features you've considered
      placeholder: A clear and concise description of any alternative approaches
    validations:
      required: false

  - type: textarea
    id: documentation
    attributes:
      label: 📚 Documentation (Optional)
      description: If this feature requires documentation, please suggest what should be included
      placeholder: Describe what documentation would be needed and how users would learn about this feature
    validations:
      required: false

  - type: textarea
    id: related_links
    attributes:
      label: 🔗 Related Links (Optional)
      description: If there are any related issues, PRs, or other resources, please provide them
      placeholder: Provide links to related resources
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: 📁 Additional Information
      description: Please provide any other relevant information
    validations:
      required: false
  
  - type: upload
    id: screenshots
    attributes:
      label: Upload relevant files
      description: "Drag and drop any relevant files."
    validations:
      required: false 
